projects:
    name: Urban Agriculture Program
    location: Rosario, Argentina
    description: In Rosario, Argentina, the urban agriculture program empowers low-income citizens to plant food on public property. Over 75ha of transformed land in seven regional farmers markets now provide a new income source, reduces urban heat impact and enhances the city's flood resistance.
    sdg_map:
        target: SDG 13
        description: "reduces urban heat impact and enhances the city's flood resistance"
    impacts:
    - description: provides a new income source for low-income citizens
    - description: reduces urban heat impact and enhances the city's flood resistance