reseach_assistant_task:
  description: >
    Use the search tool to search the internet using about the following topic {event_topic}. Strictly focus on results from {country}.
    Your goal is to collect research data and grey literature (news articles) on citizen engagements in {country}.
    If no relevant information is found, say so.
    Do not MAKE UP unnecessary URLs links, use the URLs found from the internet search tool.
    Reference information from accurate and reputable sources.
  expected_output: >
    A list of top 10 Climate Change Engagements in {country} that were reported over the {period}, add correct URLs and title of research items.
    show a count of articles found from search tools.
senior_researcher_task:
  description: >
    which is (Improve education, awareness-raising and human and institutional capacity on climate change mitigation, adaptation, impact reduction and early warning )
    
  expected_output: >
    A list of engagements initiatives mapped to SDG target 13.3. 

sector_specialist_task:
  description: >
    Your task is to extract project or program or an identified initiative from the articles collected, if you don't find it say 'N/A'.
    Extract location information from articles, if you don't find it say 'N/A'
    Review collected data for relevance to climate change.
    Map engagements to SDG target 13.3.
    Use only South African data.
    Exclude other African countries except South Africa.
    Reference information from accurate and reputable sources.
    Use the given tool to extract information about climate change initiatives. 
    Learn from the given tool and use it as a guideline.
    
  expected_output: >
    A list of engagements initiatives mapped to SDG target 13.3. 
sdg_specialist_task:
  description: >
    Your tasks are as follows:
    Search: Citizen engagement initiatives in climate action (outside South Africa).
    Identify educational initiatives about {event_topic}.
    Identify awareness campaigns about {event_topic}. 
    Find studies from the internet avout mapping SDG goals through content analysis (outside South Africa, use "Our World in Data" for clues).
    Guidelines:Search about SDG Mapping strategie.
    Provide accurate and reputable sources with links/URLs.
    If no relevant information is found, say so.

  expected_output: >
      A list of extracted articles about mapping SDG goal 13
      The list should also have accurate links or URLS that references the extracted articles.